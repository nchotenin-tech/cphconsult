openapi: 3.1.0
info:
  title: CPH Consult platform probes
  version: 0.1.0
  description: Implemented platform endpoints only. Clinical and authentication API contracts are pending.
servers:
  - url: http://127.0.0.1:3100
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: HTTP process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: alive }
  /health/database:
    get:
      operationId: getDatabaseHealth
      responses:
        '200':
          description: Connection and preliminary role checks pass; not a complete authorization audit.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: available }
        '503':
          description: Database missing, unreachable or role checks failed. Details are deliberately omitted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: unavailable }
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '503':
          description: Application readiness is intentionally false in this platform slice.
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status: { const: not_ready }
                  reason: { const: application_not_implemented }
