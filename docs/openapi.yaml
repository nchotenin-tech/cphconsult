openapi: 3.1.0
info:
  title: CPH Consult development API
  version: 0.1.0
  description: Platform, initial authentication and clinical read slice. Full clinical workflows remain pending.
servers:
  - url: http://127.0.0.1:3100
paths:
  /api/v1/consults:
    get:
      operationId: listConsults
      security: [{ sessionCookie: [] }]
      description: RLS-scoped list ordered by text ID. No dentist mapping yields an empty list.
      parameters:
        - in: query
          name: q
          description: Trimmed literal substring of patient name or case ID, case-insensitive. Empty means no search. Combined with all filters before pagination. Reset after on changes.
          schema: { type: string, maxLength: 200 }
        - in: query
          name: workflow
          schema: { type: string, enum: [all, refer, shared_care], default: all }
        - in: query
          name: progress
          description: Requires a specific workflow unless all. Finished excludes cancelled. Active includes null or unknown nonterminal states, matching legacy tracking classification. Combined with status using AND.
          schema: { type: string, enum: [all, active, finished, cancelled], default: all }
        - in: query
          name: status
          description: Consultation status only; completed may still have ongoing Refer or Shared Care. Reset after when changing filter.
          schema: { type: string, enum: [all, pending, active, completed], default: all }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: after
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Accessible cases only.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConsultSummary' }
                  nextCursor: { type: [string, 'null'] }
        '401': { description: No active session. }
        '403': { description: Password change required. }
        '422': { description: Invalid pagination. }
        '500': { description: Internal failure; details omitted. }
  /api/v1/consults/{id}:
    get:
      operationId: getConsult
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Accessible case; workflow JSON and attachments are not returned.
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/ConsultDetail' }
        '401': { description: No active session. }
        '403': { description: Password change required. }
        '404': { description: Missing or inaccessible case. }
        '500': { description: Internal failure; details omitted. }
  /api/v1/auth/login:
    post:
      operationId: login
      description: Requires Origin matching APP_ORIGIN. Sets HttpOnly session cookie; 8-hour absolute and 30-minute idle expiry.
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, minLength: 1, maxLength: 254 }
                password: { type: string, minLength: 1, description: Maximum 1024 UTF-8 bytes. }
      responses:
        '200':
          description: Authenticated; session cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { description: Invalid credentials, including unknown or inactive account. }
        '403': { description: Origin rejected. }
        '422': { description: Invalid input. }
        '429': { description: Login rate or concurrent verification limit exceeded. }
        '500': { description: Internal failure; details omitted. }
  /api/v1/auth/me:
    get:
      operationId: getCurrentSession
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current active user and CSRF token; idle timeout refreshed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { description: Missing, expired, revoked or inactive session. }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ sessionCookie: [] }]
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Session revoked and cookie cleared. }
        '401': { description: No valid session. }
        '403': { description: Origin or CSRF rejected. }
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: HTTP process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: alive }
  /health/database:
    get:
      operationId: getDatabaseHealth
      responses:
        '200':
          description: Connection and preliminary role checks pass; not a complete authorization audit.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: available }
        '503':
          description: Database missing, unreachable or role checks failed. Details are deliberately omitted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: unavailable }
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '503':
          description: Application readiness is intentionally false in this platform slice.
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status: { const: not_ready }
                  reason: { const: application_not_implemented }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cph_session
  schemas:
    ConsultSummary:
      type: object
      required: [id, patient_name, patient_age, status, post_consult_option, refer_status, shared_care_status, created_at]
      properties:
        id: { type: string }
        patient_name: { type: string }
        patient_age: { type: integer }
        status: { type: string }
        post_consult_option: { type: [string, 'null'] }
        refer_status: { type: [string, 'null'] }
        shared_care_status: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    ConsultDetail:
      allOf:
        - $ref: '#/components/schemas/ConsultSummary'
        - type: object
          required: [patient_gender, patient_scheme, consult_details, sender_id, target_hospital_id, target_specialties, target_dentist_ids, primary_consultant_id]
          properties:
            patient_gender: { type: string }
            patient_scheme: { type: string }
            consult_details: { type: string }
            sender_id: { type: [string, 'null'] }
            target_hospital_id: { type: [string, 'null'] }
            target_specialties: { type: array, items: { type: string } }
            target_dentist_ids: { type: array, items: { type: string } }
            primary_consultant_id: { type: [string, 'null'] }
    SessionResponse:
      type: object
      required: [user, csrfToken]
      properties:
        csrfToken: { type: string }
        user:
          type: object
          required: [id, login, mustChangePassword]
          properties:
            id: { type: string, format: uuid }
            login: { type: string }
            mustChangePassword: { type: boolean }
